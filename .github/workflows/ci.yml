name: ci

on:
  push:
    branches: [main, repair/**]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-secret-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: accountexpress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://ci:placeholder@localhost:5432/ci
        run: npx prisma validate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Full Vitest suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/accountexpress_test?schema=public
          HMAC_SECRET: ci-test-hmac-secret-not-production
          SESSION_SECRET: ci-test-session-secret-not-production
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Secret scan (gitleaks, working tree only)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-git --config .gitleaks.toml --exit-code 1 --no-banner
