# Sistema1 gitleaks configuration
# Extends gitleaks default rules; scoped excludes for known safe patterns.

[extend]
useDefault = true

# Global allowlist — paths never part of the committed tree in CI.
# Applied to every rule so CI-equivalent scans are fast and clean.
[allowlist]
paths = [
  '''^\.next[/\\]''',
  '''^\.env$''',
  '''^\.env\.local$''',
  '''^node_modules[/\\]''',
]
# Known non-secret values present in the committed tree:
# - Test fixtures using explicit sk-test-* / sk-valid-key-* placeholders
# - UI badge label 'landing.badgeSoc2' (false positive on generic-api-key)
stopwords = [
  '''sk-test-api-key''',
  '''sk-valid-key''',
  '''badgeSoc2''',
  '''Clave.Descarga.2026''',
  '''Clave.Mantenimiento.2026''',
  '''Recuperacion.2026''',
  '''Clave.Reanchor.2026''',
  '''Clave.Fidelity.2026''',
  '''Clave.FkBreak.2026''',
  '''Clave.RBAC.2026''',
  '''Clave.G4AB.2026''',
  '''Clave.JournalChain.2026''',
  '''Clave.Owner.Respaldo.2026''',
]
